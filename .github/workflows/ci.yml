name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (strict)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # A4's promise, run the way a reader runs it: one command, one Match, a
      # JSON report on standard output and an exit code a script can branch on.
      # The CLI needs no build step — Node runs the TypeScript source directly
      # (ADR-0009) — and the recorded hash is the README's, so determinism is
      # gated here rather than believed (ADR-0006).
      - name: Play a Match headless
        run: npm run match -- --seed 1 --ticks 600 --expect-hash bf3d192e9ab9eb5f

      # The Match above draws nothing: `emptyMatchRules.step` is a no-op, so its
      # golden hash proves the seed expansion, the canonical form and the hash
      # are portable across machines, and nothing about the draw loop — which is
      # exactly where an engine-dependent implementation would hide. This Match
      # draws on every tick instead, so the same gate covers `sfc32` itself
      # (ADR-0006, A5 review F5). Two hashes, one with draws and one without.
      - name: Play a Match that draws, headless
        run: npm run match -- --seed 1 --ticks 600 --rules draws --expect-hash 337cd166204506b0

  guards:
    name: Fences (six: import boundaries, engine allow-list, Math.random, transcendentals, ambient clock, no committed assets)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails if the simulation can reach pixi.js, if pixi.js appears outside
      # render/ and e2e/, if any code calls Math.random, if the simulation reaches
      # arithmetic or a clock no engine pins down, or if an image, font or audio
      # file has been committed. Every fence names the offending file.
      - name: Guard the fences
        run: npm run guard

  browser:
    name: Headless Chromium, software WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Headless Chromium has no GPU here; --enable-unsafe-swiftshader in
      # playwright.config.ts is what lets WebGL fall back to SwiftShader.
      - name: End-to-end
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
