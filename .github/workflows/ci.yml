name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (strict)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  guards:
    name: Fences (import guard, Math.random guard, transcendental guard)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails if the simulation can reach pixi.js, if any code calls
      # Math.random, or if the simulation uses arithmetic no engine pins down.
      # All three name the offending file.
      - name: Guard the fences
        run: npm run guard

  browser:
    name: Headless Chromium, software WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Headless Chromium has no GPU here; --enable-unsafe-swiftshader in
      # playwright.config.ts is what lets WebGL fall back to SwiftShader.
      - name: End-to-end
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
