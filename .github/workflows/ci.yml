name: CI

on:
  # Feature branches are covered by their pull request. Pushing a branch that
  # already has a pull request used to run the whole workflow twice; it no longer
  # does. A merge or a direct push to the integration branches is still checked.
  push:
    branches: [main, develop]
  pull_request:
  # Visual-frame production is explicit (#64): a manual run asks for it, and the
  # routine profiles never produce pictures.
  workflow_dispatch:
    inputs:
      visual:
        description: Produce visual frames (slow; not a gate)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (strict)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # A4's promise, run the way a reader runs it: one command, one Match, a
      # JSON report on standard output and an exit code a script can branch on.
      # The CLI needs no build step — Node runs the TypeScript source directly
      # (ADR-0009) — and the recorded hash is the README's, so determinism is
      # gated here rather than believed (ADR-0006). The default Match is B6's:
      # the theatre, the clock and the economy in one world.
      - name: Play a Match headless
        run: npm run match -- --seed 1 --ticks 600 --expect-hash 3aaaf501674cafe1

      # B5's guarantee, over the whole horizon: the default bound is three game
      # years, and a Match that runs to it terminates on exactly that tick. The
      # hash gates the calendar across every Season boundary, the year turn and,
      # now, three years of the economy — its stocks, its tiers and its Payroll.
      - name: Play a headless Match to its three-year bound
        run: npm run match -- --seed 1 --expect-hash 685ee739af48f521

      # The clock on its own, so a change in the economy cannot hide a change in
      # the calendar it runs on.
      - name: Play a Match on the strategic clock
        run: npm run match -- --seed 1 --ticks 600 --rules seasons --expect-hash 61afacff3b33a793

      # The engine and the seam alone. This Match draws nothing and advances
      # nothing, so its golden hash proves the seed expansion, the canonical form
      # and the hash are portable across machines, and nothing about the draw
      # loop — which is exactly where an engine-dependent implementation would
      # hide (A5 review F5).
      - name: Play the engine-only Match headless
        run: npm run match -- --seed 1 --ticks 600 --rules empty --expect-hash bf3d192e9ab9eb5f

      # And a Match that draws on every tick instead, so a fourth gate covers
      # `sfc32` itself (ADR-0006, A5 review F5). Five hashes: the economy at two
      # bounds, the clock, the engine alone, and the draw loop.
      - name: Play a Match that draws, headless
        run: npm run match -- --seed 1 --ticks 600 --rules draws --expect-hash 337cd166204506b0

      # B4's Match: B1's theatre and both Factions' fogs in one world. The hash
      # covers the whole map in state and what each Faction has seen of it, so a
      # change to the map or to the fog moves this line (ADR-0006, ADR-0013).
      - name: Play the theatre with fog, headless
        run: npm run match -- --seed 1 --ticks 600 --rules fog --expect-hash 3d60b17e3e9b6e50

      # P2 moved every hash below that raises a Squad: `men` names a real size,
      # `capacity` is hashed state, and Payroll follows survivors (ADR-0026,
      # ADR-0027). A moved hash is a decision in review (ADR-0006); the new
      # baselines are recorded in README.md and ADR-0027.
      #
      # #66 moved `march`, `roster`, `assault` and `blockade` again, and left
      # `economy`, `seasons`, `empty`, `draws`, `fog` and `attrition` exactly
      # where they were: a fight now moves men and nerve in proportion to the men
      # brought to bear rather than to how many Squads they are divided into, and
      # a Siege reads force instead of file counts (ADR-0028). The four moved
      # hashes are that rule, and the measurements beside it are in
      # docs/reviews/issue-66-military-balance.md.
      # #68 moves only march and roster: group Move/Attack-move now reserve
      # distinct reachable arrivals near the click. The allocation is part of
      # the rules and Replay; see docs/COMMANDS.md, Ground arrival allocation.
      #
      # C1's movement and C3's combat on the world the economy Match already
      # plays: two Roman lines of 120 and five Carthaginian bodies of 48 — the
      # same 240 men a side — mustered at their own Stronghold and ordered across
      # the map to the other one, where the two forces meet.
      # The hash covers the routes worked out over the theatre, the terrain costs
      # walked, every turn taken, the round of contact that follows and the
      # economy's half of each Squad, so a change to pathfinding, to marching or
      # to a fight moves this line and has to be a decision in review
      # (ADR-0006, ADR-0015).
      - name: March two equal forces of unequal Squads across the theatre, and let them fight, headless
        run: npm run match -- --seed 1 --ticks 600 --rules march --expect-hash b5d29129ff9d86e7

      # C4's Match: both Factions' whole rosters, the six Carthaginian types
      # including the elephant, mustered on their own ground and sent at each
      # other. The hash covers every type's strength, morale, arm and pace, so a
      # change to a roster's numbers moves this line and has to be a decision in
      # review (ADR-0006).
      - name: March both rosters across the theatre, headless
        run: npm run match -- --seed 1 --ticks 600 --rules roster --expect-hash 76b515304e285b62

      # C5's first whole Match: Rome storms Carthage's Stronghold with the ram.
      # The hash is the state the Match ended on, and the Match ended because a
      # Stronghold fell — so this line gates the walls as structures, the ram's
      # build and vulnerability, the storm, the capture and the verdict that
      # names the reason (ADR-0006, ADR-0008, ADR-0018). The hash is the state of
      # a Match the rules decided, so a Match that only ran out its bound could
      # not match it; the unit tests also assert the tick it ended on is inside
      # the bound. It moved again when D4 put each Faction's fog into the Siege
      # world: the fog is hashed state now (ADR-0013), and an open settlement's
      # front is sighted through it rather than announced (ADR-0020). A moved hash
      # is a decision in review (ADR-0006).
      - name: Win a Match by Assault, headless
        run: npm run match -- --seed 1 --ticks 9000 --rules assault --expect-hash 0f37cc5352591836

      # C5's second path: the same Stronghold starved into surrender, over
      # Seasons rather than over a fight. Its hash covers the blockade's supply
      # cut, the starvation, the garrison's nerve and the surrender — and, since
      # C6, the Attrition the besieging army pays for wintering outside its own
      # country, and since D4 the fog the Siege world now holds and hashes
      # (ADR-0013). The hash moved when each landed, and ADR-0006 says a moved
      # hash is a decision in review.
      - name: Win a Match by Blockade, headless
        run: npm run match -- --seed 1 --ticks 9000 --rules blockade --expect-hash 1f42040d1278803f

      # C6's Match: two armies in the field through four Season boundaries, one
      # of them holding position in a Roman camp and one in nobody's country. The
      # hash covers the Territory each is inferred to stand in, the men a Season
      # outside it costs and the winter that costs six percent where autumn costs
      # two, and the camp that saves Rome's army from both (ADR-0006, ADR-0005).
      - name: Winter two armies in the field, one of them in a camp, headless
        run: npm run match -- --seed 1 --ticks 9000 --rules attrition --expect-hash b6eb3698c5fafb34

      # D5's whole army crosses a Season boundary: two AI Controllers running
      # economy, field, scouting and siege at Centurio. The hash gates the
      # decisions that army makes, now that the fog it reads is hashed state
      # (ADR-0013, ADR-0020). Keep the per-tick explanations in a report rather
      # than flooding CI logs.
      - name: Play two AI Controllers with scored decision logs
        run: node src/cli/main.ts --rules ai --seed 1 --ticks 2101 --expect-hash cf3c65709f729db3 > "$RUNNER_TEMP/ai-match.json"

  guards:
    name: "Fences (seven, including AI Observation imports)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails if the simulation can reach pixi.js, if pixi.js appears outside
      # render/ and e2e/, if any code calls Math.random, if the simulation reaches
      # arithmetic or a clock no engine pins down, or if an image, font or audio
      # file has been committed. Every fence names the offending file.
      - name: Guard the fences
        run: npm run guard

  plan:
    name: Which browser gates are required
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.select.outputs.smoke }}
      acceptance: ${{ steps.select.outputs.acceptance }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The selection compares the branch with its base, which needs history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Two levels, in scripts/selection-rules.mjs and unit-tested there:
      #
      #   main pull request, main push, manual run -> smoke + acceptance
      #   push to develop                          -> smoke (post-merge net)
      #   develop pull request                     -> fast checks only
      #   develop pull request + `browser` label    -> smoke + acceptance
      #
      # Documentation may skip complete acceptance but still takes the smoke.
      # A crashed selection, an unreadable diff or an unexpected target branch
      # runs both gates: the fail-safe direction is more evidence, never less.
      - name: Select the gates
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          BRANCH: ${{ github.ref_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          args=(
            --event "$EVENT"
            --branch "$BRANCH"
            --base-branch "$BASE_BRANCH"
            --labels "$LABELS"
            --github
          )
          if [ -n "$BASE_SHA" ]; then
            args+=(--base "$BASE_SHA")
          fi

          if ! decided=$(node scripts/selection.mjs "${args[@]}"); then
            decided=$(printf 'smoke=true\nacceptance=true\n')
            echo "selection failed: browser gates run (fail-safe)" >&2
          fi
          printf '%s\n' "$decided" >> "$GITHUB_OUTPUT"

  browser-smoke:
    name: Real browser smoke
    needs: plan
    # `false` is the only answer that skips the smoke. A failed or skipped plan
    # leaves the output empty, and an empty answer runs it.
    if: ${{ !cancelled() && needs.plan.outputs.smoke != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Chromium provisioning is separate from the 90-second smoke budget: it is
      # an install, not a check (ticket #64).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Boot the real entry, give one ordinary Command through a real gesture,
      # and read the frame and the console back. No art or economy matrix.
      - name: Smoke
        run: npm run test:smoke

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  browser-acceptance:
    name: Headless Chromium, complete acceptance
    needs: plan
    # `false` is the only answer that skips the gate. A failed or skipped plan
    # leaves the output empty, and an empty answer runs acceptance.
    if: ${{ !cancelled() && needs.plan.outputs.acceptance != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Headless Chromium has no GPU here; --enable-unsafe-swiftshader in
      # playwright.config.ts is what lets WebGL fall back to SwiftShader. Every
      # browser spec runs, with visual captures off: the frames are produced by
      # the explicit visual profile, not by the gate.
      - name: End-to-end
        run: npm run test:accept

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-acceptance
          path: playwright-report/
          retention-days: 7

  visual-frames:
    name: Visual frames (explicit, not a gate)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.visual }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Sequential by default: software WebGL at 1920x1080 is the slowest thing
      # this repository runs. The same assertions as acceptance, with pictures.
      - name: Produce the frames
        env:
          SPQR_VISUAL_DIR: ${{ runner.temp }}/spqr-visual
        run: npm run test:visual

      - name: Upload the frames
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spqr-visual-frames
          path: ${{ runner.temp }}/spqr-visual/
          retention-days: 7

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7
